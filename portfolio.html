<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>My Portfolio</title><link rel="icon" href="">
<style>
:root{--a:#2f8cff;--bg:#071326;--c:#0e2140;--t:#eaf2ff;--m:#8fa6c8;--b:#1c3763;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}html,body{background:var(--bg)}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--t);min-height:100vh}
.hide{display:none!important}.card{background:var(--c);border:1px solid var(--b);border-radius:16px;padding:18px}
input,select,textarea{width:100%;padding:11px 12px;margin:6px 0;border-radius:10px;border:1px solid var(--b);background:var(--bg);color:var(--t);font:inherit}
input[type=checkbox]{width:auto;margin:0 8px 0 0}input[type=color]{height:44px;padding:3px}
button{cursor:pointer;border:0;border-radius:10px;padding:10px 16px;background:var(--a);color:#fff;font:inherit;font-weight:600}
button.g{background:transparent;border:1px solid var(--b);color:var(--t)}button.d{background:#e5484d}button.s{padding:6px 10px;font-size:13px}
.m{color:var(--m)}.w{max-width:960px;margin:0 auto;padding:18px}
#gate{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 50% 0,color-mix(in srgb,var(--a) 35%,transparent),transparent 60%)}
#gate .card{width:100%;max-width:380px;text-align:center}
.logo{width:96px;height:96px;border-radius:50%;border:3px solid var(--a);display:block;margin:0 auto 10px;object-fit:cover;user-select:none;-webkit-user-select:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
.tabs{display:flex;gap:6px;margin:14px 0}.tabs button{flex:1}.msg{margin:8px 0;font-size:14px;min-height:18px;color:#ff8a8f}.ok{color:#4cd08a}
.note{background:color-mix(in srgb,var(--a) 15%,transparent);border:1px dashed var(--a);border-radius:10px;padding:10px;font-size:13px;margin:8px 0;text-align:left}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--c);border-bottom:1px solid var(--b);display:flex;align-items:center;gap:8px;padding:10px 14px;overflow-x:auto}
nav img{width:34px;height:34px;border-radius:50%}nav b{margin-right:auto;white-space:nowrap}nav button{white-space:nowrap}
.hero{text-align:center;padding:40px 10px}.hero img{width:130px;height:130px;border-radius:50%;border:4px solid var(--a)}.hero h1{margin:14px 0 6px;font-size:2rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin:14px 0}
.grid .card h3{margin-bottom:6px}.stat{text-align:center}.stat b{display:block;font-size:1.6rem;color:var(--a)}
.th{aspect-ratio:16/9;border-radius:10px;background:linear-gradient(135deg,var(--a),#7a3cff);margin-bottom:8px;display:grid;place-items:center;font-size:28px;overflow:hidden}.th img{width:100%;height:100%;object-fit:cover}
a{color:var(--a)}.row{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--b)}
.scroll{overflow-x:auto}h2{margin:6px 0 10px}label{font-size:13px;color:var(--m)}
</style></head><body>

<img class="logo lg" id="glogo" alt="logo">

cfg=G('cfg',{name:'Your Name',tag:'Creator · Developer · Gamer',bio:'Welcome to my portfolio! Here you can see my projects, my YouTube channels and more.',accent:'#2f8cff',theme:'dark',gate:true,ejs:{s:'',t:'',k:''}});
users=G('users',[]);
projs=G('projs',[{t:'Minecraft Server Panel',d:'Web control panel with console, file manager and API keys.',l:'#'},{t:'Discord Bot',d:'Commands, tickets and automation for my community.',l:'#'},{t:'Hosting Website',d:'Marketing site with a theme picker and plans.',l:'#'}]);
yt=G('yt',{key:'',ch:[{id:'UCdemo0001',name:'Main Channel'},{id:'UCdemo0002',name:'Gaming Channel'}]});
const t=TH[cfg.theme]||TH.dark,r=document.documentElement.style;['bg','c','t','m','b'].forEach((k,i)=>r.setProperty('--'+k,t[i]));r.setProperty('--a',cfg.accent);
document.title=cfg.name+' · Portfolio';$$('.gname').forEach(e=>e.textContent=cfg.name);$$('.lg').forEach(i=>i.src=LOGO);$('link[rel=icon]').href=LOGO}
function v(id){['gate','site','admin'].forEach(x=>$('#'+x).classList.toggle('hide',x!==id))}
async function boot(){load();if(!G('pin',0))S('pin',await H('admin123'));const s=G('sess',null);if((s&&users.find(u=>u.u===s))||!cfg.gate){v('site');pg('home')}else{v('gate');gtab('l')}}
function gtab(x){['l','s','v'].forEach(k=>$('#f'+k).classList.toggle('hide',k!==x));$('#tl').className=x==='s'?'g':'';$('#ts').className=x==='s'?'':'g';$('#gm').textContent=''}
const gm=(t,ok)=>{const e=$('#gm');e.textContent=t;e.className='msg'+(ok?' ok':'')};
$('#glogo').onclick=()=>{taps++;clearTimeout(tt);tt=setTimeout(()=>taps=0,3000);if(taps>=10){taps=0;$('#pinbox').classList.remove('hide');$('#pin').focus()}};
async function adminIn(){if(await H($('#pin').value)===G('pin',''))(at('ov'),v('admin'),$('#pin').value='',$('#pinbox').classList.add('hide'));else gm('Wrong admin PIN')}
async function mail(to,code){const j=cfg.ejs;if(!j.s||!j.t||!j.k)return false;try{const r=await fetch('https://api.emailjs.com/api/v1.0/email/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({service_id:j.s,template_id:j.t,user_id:j.k,template_params:{to_email:to,code,name:cfg.name}})});return r.ok}catch(e){return false}}
async function signup(){const u=$('#su').value.trim(),e=$('#se').value.trim().toLowerCase(),p=$('#sp').value;
if(u.length<3)return gm('Username needs 3+ characters');if(!/^\S+@\S+\.\S+$/.test(e))return gm('Enter a valid email');if(p.length<6)return gm('Password needs 6+ characters');
if(users.some(x=>x.u.toLowerCase()===u.toLowerCase()||x.e===e))return gm('Username or email already used');
const code=String(100000+Math.floor(Math.random()*900000));pend={u,e,h:await H(p),code,exp:Date.now()+6e5};
const sent=await mail(e,code);$('#demo').innerHTML=sent?'Code sent to <b>'+E(e)+'</b>. Check your inbox.':'<b>Demo mode:</b> no mail server is connected, so your code is <b>'+code+'</b>. Add EmailJS keys in Admin → Settings to send real emails.';gtab('v')}
function verify(){if(!pend)return;if(Date.now()>pend.exp)return gm('Code expired, sign up again');if($('#vc').value.trim()!==pend.code)return gm('Wrong code');
users.push({u:pend.u,e:pend.e,p:pend.h,at:Date.now(),last:Date.now(),n:1});S('users',users);S('sess',pend.u);pend=null;boot()}
async function login(){const i=$('#li').value.trim().toLowerCase(),h=await H($('#lp').value),u=users.find(x=>(x.u.toLowerCase()===i||x.e===i)&&x.p===h);
if(!u)return gm('Wrong username/email or password');u.last=Date.now();u.n=(u.n||0)+1;S('users',users);S('sess',u.u);boot()}
function out(){S('sess',null);boot()}
function pg(p){const el=$('#page');window.scrollTo(0,0);
if(p==='home')el.innerHTML='<div class="hero"><img class="lg" src="'+LOGO+'" alt=""><h1>'+E(cfg.name)+'</h1><p class="m">'+E(cfg.tag)+'</p><p style="max-width:560px;margin:14px auto">'+E(cfg.bio)+'</p><button onclick="pg(\'projects\')">View projects</button> <button class="g" onclick="pg(\'yt\')">My YouTube</button></div>';
if(p==='projects')el.innerHTML='<h2>Projects</h2><div class="grid">'+projs.map(x=>'<div class="card"><h3>'+E(x.t)+'</h3><p class="m">'+E(x.d)+'</p>'+(x.l&&x.l!=='#'?'<p style="margin-top:8px"><a href="'+E(x.l)+'" target="_blank" rel="noopener">Open ↗</a></p>':'')+'</div>').join('')+'</div>'+(projs.length?'':'<p class="m">No projects yet.</p>');
if(p==='yt'){el.innerHTML='<h2>YouTube</h2>'+(yt.ch.length?'<select id="ysel" onchange="ytSel=this.value;ytShow()">'+yt.ch.map((c,i)=>'<option value="'+i+'"'+(i==ytSel?' selected':'')+'>'+E(c.name||c.id)+'</option>').join('')+'</select><div id="ybox" class="m">Loading…</div>':'<p class="m">No channels added yet.</p>');if(yt.ch.length)ytShow()}}
function demo(id){let s=[...id].reduce((a,c)=>(a*31+c.charCodeAt(0))>>>0,7);return{title:'Demo channel',subs:1000+s%900000,views:50000+(s*7)%90000000,count:24,demo:1,videos:[...Array(6)].map((_,i)=>({id:'',t:'Video '+(i+1)+' title',v:500+(s*(i+3))%800000}))}}
async function ytGet(id){if(yt.key){try{const J=u=>fetch('https://www.googleapis.com/youtube/v3/'+u+'&key='+yt.key).then(r=>r.json());
const c=(await J('channels?part=snippet,statistics,contentDetails&id='+id)).items[0],up=c.contentDetails.relatedPlaylists.uploads,
pl=(await J('playlistItems?part=contentDetails&maxResults=12&playlistId='+up)).items.map(i=>i.contentDetails.videoId),
vs=(await J('videos?part=snippet,statistics&id='+pl.join(','))).items;
return{title:c.snippet.title,subs:+c.statistics.subscriberCount,views:+c.statistics.viewCount,count:+c.statistics.videoCount,videos:vs.map(x=>({id:x.id,t:x.snippet.title,v:+x.statistics.viewCount,th:x.snippet.thumbnails.medium.url}))}}catch(e){}}
return demo(id)}
async function ytShow(){const c=yt.ch[ytSel],b=$('#ybox');if(!c||!b)return;const d=await ytGet(c.id);
b.className='';b.innerHTML=(d.demo?'<div class="note">Showing demo numbers. Add a YouTube Data API key in Admin → YouTube for live stats.</div>':'')+'<h3 style="margin:8px 0">'+E(d.title)+'</h3><div class="grid"><div class="card stat"><b>'+N(d.subs)+'</b>Subscribers</div><div class="card stat"><b>'+N(d.views)+'</b>Total views</div><div class="card stat"><b>'+N(d.count)+'</b>Videos</div></div><h3>Latest videos</h3><div class="grid">'+d.videos.map(x=>'<div class="card"><div class="th">'+(x.th?'<img src="'+E(x.th)+'" alt="">':'▶')+'</div><b>'+E(x.t)+'</b><p class="m">'+N(x.v)+' views</p>'+(x.id?'<a href="https://www.youtube.com/watch?v='+E(x.id)+'" target="_blank" rel="noopener">Watch ↗</a>':'')+'</div>').join('')+'</div>'}
function at(t){tab=t;const el=$('#apage'),I=(id,l,val,ty)=>'<label>'+l+'</label><input id="'+id+'" type="'+(ty||'text')+'" value="'+E(val)+'">';
if(t==='ov'){const tot=users.reduce((a,u)=>a+(u.n||0),0);el.innerHTML='<h2>Overview</h2><div class="grid"><div class="card stat"><b>'+users.length+'</b>Members</div><div class="card stat"><b>'+tot+'</b>Total logins</div><div class="card stat"><b>'+projs.length+'</b>Projects</div><div class="card stat"><b>'+yt.ch.length+'</b>YouTube channels</div></div><div class="card scroll"><h3>Members</h3>'+(users.map((u,i)=>'<div class="row"><span><b>'+E(u.u)+'</b><br><span class="m">'+E(u.e)+' · '+(u.n||0)+' logins · last '+new Date(u.last).toLocaleDateString()+'</span></span><button class="d s" onclick="udel('+i+')">Remove</button></div>').join('')||'<p class="m">No members yet.</p>')+'</div>'}
if(t==='st')el.innerHTML='<h2>Settings</h2><div class="card">'+I('cn','Site name',cfg.name)+I('ct','Tagline',cfg.tag)+'<label>Bio</label><textarea id="cb" rows="3">'+E(cfg.bio)+'</textarea>'+I('ca','Accent color',cfg.accent,'color')+'<label>Theme</label><select id="cth">'+Object.keys(TH).map(k=>'<option'+(k===cfg.theme?' selected':'')+'>'+k+'</option>').join('')+'</select><p style="margin:10px 0"><label><input type="checkbox" id="cg"'+(cfg.gate?' checked':'')+'>Require login to view the site</label></p><h3 style="margin:10px 0 4px">Email sending (EmailJS)</h3>'+I('es','Service ID',cfg.ejs.s)+I('et','Template ID',cfg.ejs.t)+I('ek','Public key',cfg.ejs.k)+'<button onclick="ssave()">Save settings</button></div>';
if(t==='pr')el.innerHTML='<h2>Projects</h2><div class="card">'+projs.map((p,i)=>'<div class="row"><span><b>'+E(p.t)+'</b><br><span class="m">'+E(p.d)+'</span></span><button class="d s" onclick="pdel('+i+')">Delete</button></div>').join('')+'</div><div class="card" style="margin-top:14px"><h3>Add project</h3>'+I('pt','Title','')+I('pd','Description','')+I('pl','Link (optional)','')+'<button onclick="padd()">Add</button></div>';
if(t==='yt')el.innerHTML='<h2>YouTube</h2><div class="card">'+I('yk','YouTube Data API key (for live stats)',yt.key)+'<button onclick="yk()" style="margin-top:6px">Save key</button></div><div class="card" style="margin-top:14px"><h3>Channels</h3>'+yt.ch.map((c,i)=>'<div class="row"><span><b>'+E(c.name)+'</b><br><span class="m">'+E(c.id)+'</span></span><button class="d s" onclick="ydel('+i+')">Remove</button></div>').join('')+I('yn','Display name','')+I('yi','Channel ID (starts with UC)','')+'<button onclick="yadd()">Add channel</button></div>';
if(t==='sc')el.innerHTML='<h2>Security</h2><div class="card"><p class="m">Default admin PIN is admin123. Change it now.</p>'+I('np','New admin PIN','','password')+'<button onclick="pinset()">Change PIN</button></div>'}
const val=id=>$('#'+id).value.trim(),done=()=>{load();at(tab)};
function ssave(){cfg={...cfg,name:val('cn'),tag:val('ct'),bio:val('cb'),accent:val('ca'),theme:val('cth'),gate:$('#cg').checked,ejs:{s:val('es'),t:val('et'),k:val('ek')}};S('cfg',cfg);done()}
function udel(i){users.splice(i,1);S('users',users);done()}
function padd(){if(!val('pt'))return;projs.push({t:val('pt'),d:val('pd'),l:val('pl')});S('projs',projs);done()}
function pdel(i){projs.splice(i,1);S('projs',projs);done()}
function yk(){yt.key=val('yk');S('yt',yt);done()}
function yadd(){if(!val('yi'))return;yt.ch.push({id:val('yi'),name:val('yn')||val('yi')});S('yt',yt);done()}
function ydel(i){yt.ch.splice(i,1);ytSel=0;S('yt',yt);done()}
async function pinset(){if(val('np').length<4)return;S('pin',await H(val('np')));alert('PIN changed');$('#np').value=''}
boot();
</script></body></html>
